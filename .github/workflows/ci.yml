name: CI

# Issue #3 — Epic 0: prevent broken PRs.
# Runs lint + typecheck + expo-doctor + web export smoke on every
# push to dev/main and every PR targeting dev/main.
# Owner action required (one time): repo Settings -> Branches ->
# add rule for `dev` -> check "Require status checks to pass" -> select `check`.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 1
  EXPO_NO_TELEMETRY: 1

jobs:
  check:
    name: lint / typecheck / doctor / web-export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (expo lint)
        run: npm run lint -- --no-cache

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Expo doctor
        run: npm run doctor

      - name: Web export smoke test
        run: npx expo export --platform web
